version: '3.8'

services:
  # MySQL Database Service
  mysql_db:
    image: mysql:8.0
    container_name: campusconnect_mysql
    restart: always
    environment:
      MYSQL_DATABASE: campus_connect
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campus_network

  # Spring Boot Web Application
  campusconnect_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusconnect_web
    restart: always
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql_db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: campus_connect
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - app_uploads:/app/uploads
    networks:
      - campus_network

volumes:
  mysql_data:
  app_uploads:

networks:
  campus_network:
    driver: bridge
