<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Profile Settings')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container-fluid px-lg-5">
    <div class="row">
        <div class="col-lg-3 col-xl-2 px-0 d-none d-lg-block">
            <div th:replace="~{fragments/sidebar :: studentSidebar('profile')}"></div>
        </div>

        <div class="col-lg-9 col-xl-10 py-4 px-md-4">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="glass-panel p-4 mb-4">
                <h3 class="fw-bold text-white mb-1">Student Profile &amp; Settings</h3>
                <p class="text-muted small mb-0">Manage your contact details and view verified academic identity credentials</p>
            </div>

            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="glass-panel p-4 p-md-5">
                        <h5 class="fw-bold text-white mb-4">Personal &amp; Contact Details</h5>

                        <form th:action="@{/student/profile}" method="post">
                            <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}"/>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" name="fullName" th:value="${user.fullName}" class="form-control" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Email Address (Locked)</label>
                                    <input type="email" th:value="${user.email}" class="form-control bg-body" disabled>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Contact Phone</label>
                                    <input type="tel" name="phone" th:value="${user.phone}" class="form-control" placeholder="10-digit mobile number">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Student ID / Roll Number</label>
                                    <input type="text" th:value="${user.rollNumber}" class="form-control bg-body" disabled>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Department / Branch</label>
                                    <input type="text" name="department" th:value="${user.department}" class="form-control" placeholder="e.g. Computer Science & Engineering">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Semester / Year</label>
                                    <input type="text" name="semester" th:value="${user.semester}" class="form-control" placeholder="e.g. 6th Semester">
                                </div>
                            </div>

                            <div class="pt-4 border-top border-secondary border-opacity-25 mt-4 text-end">
                                <button type="submit" class="btn btn-brand">
                                    <i class="bi bi-save me-1"></i> Save Profile Changes
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="glass-panel p-4">
                        <h5 class="fw-bold text-white mb-3">Verified Academic Identity</h5>

                        <div class="text-center py-3">
                            <div class="rounded-circle bg-primary bg-opacity-25 text-primary mx-auto mb-2 d-flex align-items-center justify-content-center" style="width: 64px; height: 64px; font-size: 1.8rem; font-weight: 700;">
                                <span th:text="${#strings.substring(user.fullName, 0, 1)}">U</span>
                            </div>
                            <h6 class="text-white fw-bold mb-0" th:text="${user.fullName}">Rahul Sharma</h6>
                            <span class="text-muted small" th:text="${user.email}">user@college.edu</span>
                        </div>

                        <hr class="border-secondary border-opacity-25 my-3">

                        <div class="d-flex flex-column gap-2 text-muted small">
                            <div class="d-flex justify-content-between">
                                <span>Institution:</span>
                                <strong class="text-white text-end" th:text="${user.effectiveCollegeName}">CGC University Mohali</strong>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span>Account Role:</span>
                                <span class="badge" th:classappend="${user.isInternalStudent()} ? 'bg-primary' : 'bg-info'"
                                      th:text="${user.isInternalStudent()} ? 'CGC Internal Student' : 'External Student'">Role</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span>Account Status:</span>
                                <span class="badge bg-success" th:text="${user.status}">ACTIVE</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span>Member Since:</span>
                                <span class="text-white" th:text="${#temporals.format(user.createdAt, 'MMM yyyy')}">Nov 2026</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
