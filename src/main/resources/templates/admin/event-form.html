<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(${eventDto.id != null ? 'Edit Event' : 'Create New Event'})}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container-fluid px-lg-5">
    <div class="row">
        <div class="col-lg-3 col-xl-2 px-0 d-none d-lg-block">
            <div th:replace="~{fragments/sidebar :: adminSidebar('events')}"></div>
        </div>

        <div class="col-lg-9 col-xl-10 py-4 px-md-4">
            <div class="glass-panel p-4 mb-4">
                <a th:href="@{/admin/events}" class="text-muted small text-decoration-none mb-2 d-inline-block">
                    <i class="bi bi-arrow-left me-1"></i> Back to Events List
                </a>
                <h3 class="fw-bold text-white mb-0" th:text="${eventDto.id != null ? 'Edit Event Details' : 'Create New Campus Event'}">Event Form</h3>
            </div>

            <div class="glass-panel p-4 p-md-5">
                <form th:action="${eventDto.id != null ? '/admin/events/edit/' + eventDto.id : '/admin/events/new'}"
                      th:object="${eventDto}" method="post">
                    <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}"/>
                    <input type="hidden" th:field="*{id}"/>

                    <div class="row g-4">
                        <!-- BASIC INFO -->
                        <div class="col-12">
                            <h5 class="fw-bold text-white border-bottom border-secondary border-opacity-25 pb-2 mb-3">1. Basic Event Details</h5>
                        </div>

                        <div class="col-md-8">
                            <label class="form-label">Event Title *</label>
                            <input type="text" th:field="*{title}" class="form-control" placeholder="e.g. CGC Hackathon 2026: CodeSpark" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Category *</label>
                            <select th:field="*{categoryId}" class="form-select" required>
                                <option value="">Select Category...</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Tech</option>
                            </select>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Event Description *</label>
                            <textarea th:field="*{description}" rows="4" class="form-control" placeholder="Detailed event overview, agenda highlights, prizes, rules..." required></textarea>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Banner Image URL</label>
                            <input type="url" th:field="*{bannerImageUrl}" class="form-control" placeholder="https://images.unsplash.com/photo-...">
                            <div class="text-muted small mt-1">Provide a high-resolution landscape image URL for event banners.</div>
                        </div>

                        <!-- SCHEDULE & VENUE -->
                        <div class="col-12 pt-3">
                            <h5 class="fw-bold text-white border-bottom border-secondary border-opacity-25 pb-2 mb-3">2. Schedule &amp; Venue Allocation</h5>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Event Start Date &amp; Time *</label>
                            <input type="datetime-local" th:field="*{startDate}" class="form-control" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Event End Date &amp; Time *</label>
                            <input type="datetime-local" th:field="*{endDate}" class="form-control" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Campus Venue</label>
                            <select th:field="*{venueId}" class="form-select">
                                <option value="">Select Venue...</option>
                                <option th:each="v : ${venues}" th:value="${v.id}" th:text="${v.displayName}">Auditorium</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Custom Venue / Online Link</label>
                            <input type="text" th:field="*{customVenueDetails}" class="form-control" placeholder="e.g. Google Meet Link or Ground 2">
                        </div>

                        <!-- REGISTRATION SETTINGS -->
                        <div class="col-12 pt-3">
                            <h5 class="fw-bold text-white border-bottom border-secondary border-opacity-25 pb-2 mb-3">3. Registration Controls &amp; Capacity</h5>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Registration Opening Date &amp; Time</label>
                            <input type="datetime-local" th:field="*{registrationStartDate}" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Registration Deadline *</label>
                            <input type="datetime-local" th:field="*{registrationDeadline}" class="form-control" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('registrationDeadline')}" th:errors="*{registrationDeadline}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Maximum Capacity *</label>
                            <input type="number" th:field="*{maxCapacity}" min="1" class="form-control" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('maxCapacity')}" th:errors="*{maxCapacity}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Registration Fee (₹) *</label>
                            <input type="number" step="0.01" th:field="*{registrationFee}" min="0" class="form-control" required>
                            <div class="text-muted small mt-1">Set to 0 for free events.</div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Audience Visibility *</label>
                            <select th:field="*{visibility}" class="form-select" required>
                                <option value="ALL">Both CGC &amp; External Colleges</option>
                                <option value="INTERNAL_ONLY">Internal CGC Mohali Students Only</option>
                                <option value="EXTERNAL_ONLY">External College Students Only</option>
                            </select>
                        </div>

                        <!-- TEAM SETTINGS -->
                        <div class="col-12">
                            <div class="p-3 rounded-3 bg-body bg-opacity-50 border border-secondary border-opacity-25">
                                <div class="form-check form-switch mb-3">
                                    <input class="form-check-input" type="checkbox" th:field="*{allowTeamRegistration}" id="teamSwitch">
                                    <label class="form-check-label fw-bold text-white" for="teamSwitch">Allow Team Participation (e.g. Hackathons, Quizzes)</label>
                                </div>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Minimum Team Size</label>
                                        <input type="number" th:field="*{minTeamSize}" min="1" max="10" class="form-control">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Maximum Team Size</label>
                                        <input type="number" th:field="*{maxTeamSize}" min="1" max="10" class="form-control">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- COORDINATOR CONTACT & STATUS -->
                        <div class="col-12 pt-3">
                            <h5 class="fw-bold text-white border-bottom border-secondary border-opacity-25 pb-2 mb-3">4. Coordination &amp; Publication</h5>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Coordinator Name *</label>
                            <input type="text" th:field="*{coordinatorName}" class="form-control" placeholder="Prof. / Er. Name" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('coordinatorName')}" th:errors="*{coordinatorName}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Coordinator Email *</label>
                            <input type="email" th:field="*{coordinatorEmail}" class="form-control" placeholder="coordinator@cgc.edu.in" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('coordinatorEmail')}" th:errors="*{coordinatorEmail}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Coordinator Phone *</label>
                            <input type="tel" th:field="*{coordinatorPhone}" class="form-control" placeholder="Contact number" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('coordinatorPhone')}" th:errors="*{coordinatorPhone}"></div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Eligibility Requirements</label>
                            <input type="text" th:field="*{eligibilityRequirements}" class="form-control" placeholder="e.g. Open to B.Tech, BCA, MCA with valid College ID">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Event Lifecycle Status</label>
                            <select th:field="*{status}" class="form-select">
                                <option value="UPCOMING">Upcoming</option>
                                <option value="ONGOING">Ongoing</option>
                                <option value="COMPLETED">Completed</option>
                                <option value="CANCELLED">Cancelled</option>
                            </select>
                        </div>

                        <div class="col-md-6 d-flex align-items-center pt-md-4">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{published}" id="publishSwitch">
                                <label class="form-check-label fw-bold text-white" for="publishSwitch">Publish Immediately to Catalog</label>
                            </div>
                        </div>
                    </div>

                    <div class="pt-4 border-top border-secondary border-opacity-25 mt-4 d-flex justify-content-end gap-2">
                        <a th:href="@{/admin/events}" class="btn btn-outline-glass">Cancel</a>
                        <button type="submit" class="btn btn-brand px-4">
                            <i class="bi bi-check2-circle me-1"></i> Save Event
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
