<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Students Directory')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container-fluid px-lg-5">
    <div class="row">
        <div class="col-lg-3 col-xl-2 px-0 d-none d-lg-block">
            <div th:replace="~{fragments/sidebar :: adminSidebar('students')}"></div>
        </div>

        <div class="col-lg-9 col-xl-10 py-4 px-md-4">
            <div class="glass-panel p-4 mb-4">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center">
                    <div>
                        <h3 class="fw-bold text-white mb-1"><i class="bi bi-people text-primary me-2"></i> User &amp; Student Directory</h3>
                        <p class="text-muted small mb-0">Roster of registered internal scholars and approved external college participants</p>
                    </div>
                    <div class="mt-3 mt-md-0">
                        <span class="badge bg-secondary px-3 py-2" th:text="${students.size()} + ' Total Users'">0 Users</span>
                    </div>
                </div>
            </div>

            <div class="glass-panel p-4">
                <div class="table-responsive">
                    <table class="table table-dark-custom align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Name &amp; Email</th>
                                <th>College / University</th>
                                <th>Roll No. / ID</th>
                                <th>Department</th>
                                <th>Portal Role</th>
                                <th>Status</th>
                                <th>Joined</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s : ${students}">
                                <td>
                                    <div class="fw-bold text-white" th:text="${s.fullName}">Student Name</div>
                                    <div class="text-muted small" th:text="${s.email}">email</div>
                                </td>
                                <td>
                                    <span class="text-muted small" th:text="${s.effectiveCollegeName}">CGC University Mohali</span>
                                </td>
                                <td>
                                    <span class="font-monospace small text-primary" th:text="${s.rollNumber != null ? s.rollNumber : 'N/A'}">2023CSE1042</span>
                                </td>
                                <td>
                                    <span class="text-muted small" th:text="${s.department != null ? s.department : 'General'}">Department</span>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${s.isAdmin()} ? 'bg-danger' : (${s.isInternalStudent()} ? 'bg-primary' : 'bg-info')"
                                          th:text="${s.isAdmin()} ? 'ADMIN' : (${s.isInternalStudent()} ? 'CGC STUDENT' : 'EXTERNAL')">ROLE</span>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${s.status.name() == 'ACTIVE'} ? 'bg-success' : (${s.status.name() == 'PENDING_APPROVAL'} ? 'bg-warning text-dark' : 'bg-danger')"
                                          th:text="${s.status}">ACTIVE</span>
                                </td>
                                <td>
                                    <span class="text-muted small" th:text="${#temporals.format(s.createdAt, 'dd MMM yyyy')}">Date</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
