<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Manage Events')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container-fluid px-lg-5">
    <div class="row">
        <div class="col-lg-3 col-xl-2 px-0 d-none d-lg-block">
            <div th:replace="~{fragments/sidebar :: adminSidebar('events')}"></div>
        </div>

        <div class="col-lg-9 col-xl-10 py-4 px-md-4">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${infoMessage}" class="alert alert-info alert-dismissible fade show" role="alert">
                <i class="bi bi-info-circle-fill me-2"></i> <span th:text="${infoMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="glass-panel p-4 mb-4">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center">
                    <div>
                        <h3 class="fw-bold text-white mb-1">Campus Event Management</h3>
                        <p class="text-muted small mb-0">Create, edit, schedule, publish, or cancel events for CGC University Mohali</p>
                    </div>
                    <div class="mt-3 mt-md-0">
                        <a th:href="@{/admin/events/new}" class="btn btn-brand">
                            <i class="bi bi-plus-lg me-1"></i> Add New Event
                        </a>
                    </div>
                </div>
            </div>

            <div class="glass-panel p-4">
                <div class="table-responsive">
                    <table class="table table-dark-custom align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Event</th>
                                <th>Category</th>
                                <th>Start Date</th>
                                <th>Capacity</th>
                                <th>Fee</th>
                                <th>Visibility</th>
                                <th>Status</th>
                                <th>Published</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="ev : ${events}">
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <img th:src="${ev.bannerImageUrl != null ? ev.bannerImageUrl : 'https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=100'}"
                                             alt="thumb" class="rounded-2 object-fit-cover d-none d-sm-block" width="45" height="35">
                                        <div>
                                            <a th:href="@{'/admin/events/' + ${ev.id}}" class="fw-bold text-white text-decoration-none hover-white" th:text="${ev.title}">Event Title</a>
                                            <div class="text-muted small" style="font-size: 0.72rem;" th:text="${ev.venueDisplayName}">Venue</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <span class="badge" th:style="'background: ' + ${ev.category.colorHex} + '22; color: ' + ${ev.category.colorHex}"
                                          th:text="${ev.category.name}">Category</span>
                                </td>
                                <td>
                                    <div class="text-white small" th:text="${#temporals.format(ev.startDate, 'dd MMM yyyy')}">Date</div>
                                    <div class="text-muted small" style="font-size: 0.72rem;" th:text="${#temporals.format(ev.startDate, 'hh:mm a')}">Time</div>
                                </td>
                                <td>
                                    <span class="text-white fw-bold small" th:text="${ev.currentRegistrations}">20</span>
                                    <span class="text-muted small"> / <span th:text="${ev.maxCapacity}">100</span></span>
                                </td>
                                <td>
                                    <span class="small" th:text="${ev.registrationFee == 0 ? 'FREE' : '₹' + ev.registrationFee}">FREE</span>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${ev.visibility.name() == 'ALL'} ? 'bg-success' : (${ev.visibility.name() == 'INTERNAL_ONLY'} ? 'bg-primary' : 'bg-info')"
                                          th:text="${ev.visibility.name() == 'ALL'} ? 'ALL' : (${ev.visibility.name() == 'INTERNAL_ONLY'} ? 'CGC' : 'EXT')">ALL</span>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${ev.status.name() == 'UPCOMING'} ? 'badge-status-upcoming' : (${ev.status.name() == 'ONGOING'} ? 'badge-status-ongoing' : 'badge-status-completed')"
                                          th:text="${ev.status}">UPCOMING</span>
                                </td>
                                <td>
                                    <form th:action="@{'/admin/events/toggle-publish/' + ${ev.id}}" method="post">
                                        <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}"/>
                                        <button type="submit" class="btn btn-sm" th:classappend="${ev.published} ? 'btn-success' : 'btn-outline-secondary'"
                                                th:title="${ev.published} ? 'Click to unpublish' : 'Click to publish'" style="font-size: 0.72rem; padding: 0.2rem 0.5rem;">
                                            <i class="bi" th:classappend="${ev.published} ? 'bi-eye-fill' : 'bi-eye-slash-fill'"></i>
                                            <span th:text="${ev.published} ? 'Live' : 'Draft'">Live</span>
                                        </button>
                                    </form>
                                </td>
                                <td class="text-end">
                                    <div class="d-inline-flex gap-1">
                                        <a th:href="@{'/admin/events/' + ${ev.id}}" class="btn btn-sm btn-outline-glass" title="View details & schedules">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{'/admin/events/edit/' + ${ev.id}}" class="btn btn-sm btn-outline-glass" title="Edit event">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{'/admin/events/delete/' + ${ev.id}}" method="post" onsubmit="return confirm('Are you sure you want to delete this event? All registrations and schedules will be deleted.');" class="d-inline">
                                            <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}"/>
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete event">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
