<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Submit Event Feedback')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="py-5">
    <div class="container py-lg-4">
        <div class="row justify-content-center">
            <div class="col-lg-7 col-md-9">
                <div class="glass-panel p-4 p-md-5">
                    <div class="mb-4 text-center">
                        <a th:href="@{'/events/' + ${event.id}}" class="text-muted small text-decoration-none mb-2 d-inline-block">
                            <i class="bi bi-arrow-left me-1"></i> Back to Event Details
                        </a>
                        <span class="badge bg-warning text-dark mb-2">Participant Review</span>
                        <h3 class="fw-bold text-white mb-1" th:text="${event.title}">Event Title</h3>
                        <p class="text-muted small">Share your experience to help the CGC Event Committee enhance future campus activities.</p>
                    </div>

                    <form th:action="@{/feedback/submit}" th:object="${feedbackDto}" method="post">
                        <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}"/>
                        <input type="hidden" th:field="*{eventId}"/>

                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Overall Experience (1 to 5 Stars) *</label>
                                <select th:field="*{overallRating}" class="form-select" required>
                                    <option value="5">★★★★★ - Excellent (5)</option>
                                    <option value="4">★★★★☆ - Very Good (4)</option>
                                    <option value="3">★★★☆☆ - Average (3)</option>
                                    <option value="2">★★☆☆☆ - Needs Improvement (2)</option>
                                    <option value="1">★☆☆☆☆ - Poor (1)</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Event Organization *</label>
                                <select th:field="*{organizationRating}" class="form-select" required>
                                    <option value="5">★★★★★ - Flawless Scheduling (5)</option>
                                    <option value="4">★★★★☆ - Well Organized (4)</option>
                                    <option value="3">★★★☆☆ - Acceptable (3)</option>
                                    <option value="2">★★☆☆☆ - Disorganized (2)</option>
                                    <option value="1">★☆☆☆☆ - Very Poor (1)</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Venue &amp; Facilities *</label>
                                <select th:field="*{venueRating}" class="form-select" required>
                                    <option value="5">★★★★★ - Exceptional Venue &amp; AV (5)</option>
                                    <option value="4">★★★★☆ - Good Comfort (4)</option>
                                    <option value="3">★★★☆☆ - Adequate (3)</option>
                                    <option value="2">★★☆☆☆ - Cramped / Poor Audio (2)</option>
                                    <option value="1">★☆☆☆☆ - Uncomfortable (1)</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Coordinator Assistance *</label>
                                <select th:field="*{coordinationRating}" class="form-select" required>
                                    <option value="5">★★★★★ - Very Helpful &amp; Responsive (5)</option>
                                    <option value="4">★★★★☆ - Helpful (4)</option>
                                    <option value="3">★★★☆☆ - Neutral (3)</option>
                                    <option value="2">★★☆☆☆ - Unresponsive (2)</option>
                                    <option value="1">★☆☆☆☆ - Unhelpful (1)</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Comments &amp; Suggestions</label>
                                <textarea th:field="*{comments}" rows="4" class="form-control" placeholder="What did you enjoy most? How can we make the next edition even better?"></textarea>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-brand w-100 py-2">
                            <i class="bi bi-star-fill me-1 text-warning"></i> Submit Official Feedback
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
