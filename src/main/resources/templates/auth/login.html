<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Log In')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="py-5 d-flex align-items-center">
    <div class="container py-lg-4">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8">
                <div class="glass-panel p-4 p-md-5">
                    <div class="text-center mb-4">
                        <img th:src="@{/images/cgc-logo.svg}" alt="CGC Mohali" height="42" class="mb-3">
                        <h3 class="fw-bold text-white mb-1">Welcome Back</h3>
                        <p class="text-muted small">Sign in to your CampusConnect account</p>
                    </div>

                    <!-- Flash messages -->
                    <div th:if="${loginError}" class="alert alert-danger py-2 small" th:text="${loginError}"></div>
                    <div th:if="${logoutSuccess}" class="alert alert-success py-2 small" th:text="${logoutSuccess}"></div>
                    <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

                    <form th:action="@{/auth/login-process}" method="post">
                        <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}"/>

                        <div class="mb-3">
                            <label class="form-label" for="username">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-surface border-secondary border-opacity-25 text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="username" name="username" class="form-control" placeholder="name@college.edu" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label mb-0" for="password">Password</label>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-surface border-secondary border-opacity-25 text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-brand w-100 py-2 mb-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
                        </button>
                    </form>

                    <!-- QUICK DEMO PRESETS (For effortless review/testing!) -->
                    <div class="p-3 rounded-3 bg-body bg-opacity-75 border border-secondary border-opacity-25 mt-3">
                        <div class="text-muted fw-bold mb-2" style="font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase;">
                            <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Test Credentials
                        </div>
                        <div class="d-flex flex-wrap gap-1">
                            <button type="button" class="btn btn-sm btn-outline-glass small py-1" onclick="fillLogin('admin@cgc.edu.in', 'Admin@123')">
                                <i class="bi bi-shield-fill text-danger me-1"></i> Admin
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-glass small py-1" onclick="fillLogin('rahul.cse@cgc.edu.in', 'Student@123')">
                                <i class="bi bi-mortarboard-fill text-primary me-1"></i> CGC Student
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-glass small py-1" onclick="fillLogin('priya.sharma@thapar.edu', 'Student@123')">
                                <i class="bi bi-buildings-fill text-info me-1"></i> External
                            </button>
                        </div>
                    </div>

                    <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                        <span class="text-muted small">Don't have an account yet?</span>
                        <div class="mt-2 d-flex justify-content-center gap-2">
                            <a th:href="@{/auth/register/internal}" class="small text-primary text-decoration-none fw-semibold">CGC Student</a>
                            <span class="text-muted">&bull;</span>
                            <a th:href="@{/auth/register/external}" class="small text-info text-decoration-none fw-semibold">External College Student</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
function fillLogin(email, pwd) {
    document.getElementById('username').value = email;
    document.getElementById('password').value = pwd;
}
</script>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
