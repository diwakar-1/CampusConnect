server:
  port: 8080
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: CampusConnect
  profiles:
    active: mysql

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:campusconnect.cgc@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

campusconnect:
  college:
    name: "CGC University Mohali"
    short-name: "CGC Mohali"
    domain: "cgc.edu.in"
    address: "Landran, Sector 112, Greater Mohali, Punjab 140307"
  app:
    base-url: "http://localhost:8080"
    upload-dir: "uploads/"

